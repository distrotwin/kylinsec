# 麒麟信安桌面版 V6 —— 当前在维护的桌面线，全线最新的 ABI
#
# 为什么走 rpmrepo 而不是从 ISO 切片：厂商放 ISO 的 mirrorlists.kylinsec.com.cn
# 对 GitHub runner 全量 403，而且真文件与不存在的路径同样 403 —— 即那台主机
# 不给存在性信号，「探不通」与「不存在」分不开，本机直连与走代理都一样。
# 它的公开 rpm 源 mirrorlist.kylinsec.com.cn:8888（注意主机名是单数、端口 8888）
# 则 200/404 分明、秒级可达。取材因此走源。
#
# 与介质的差距量过：devel 档对 2025-07-04 那张 Desktop 6 盘，2710 个共有包名里
# 117 项版本不同、只有 5 项上游版本不同；gcc / gcc-c++ / libstdc++ / binutils /
# rpm / bash / openssl / ca-certificates / python3 / tzdata 与介质逐字符相同。
# 详见 README 的「镜像与安装介质的关系」。
DID=v6
DISPLAY_NAME="麒麟信安桌面版 V6"
IMAGE=kylinsec-v6
FAMILY=rpm
METHOD=rpmrepo

# ── 取材 ────────────────────────────────────────────────────────────────────
# 两个源：os/ 是冻结的发布树（revision 2025-01-17），update/ 是滚动的维护树
# （revision 2026-08-19）。合并按 EVR 取最新，所以书写顺序不影响结果。
# 配上 update/ 之后镜像比 2025-07 那张盘**新**（glibc 2.38-65 对盘上的 2.38-54、
# openssl 3.0.12-47 对 3.0.12-15），这个方向是安全的：上游版本全部不变，
# 符号版本天花板不动，而 openssl 那一跳是一大批 CVE 修复。
_KSREPO=http://mirrorlist.kylinsec.com.cn:8888/publicrepo
REPO_BASES="$_KSREPO/6/os/$RPMARCH $_KSREPO/6/update/$RPMARCH"
case "$ARCH" in
  loong64)
    # loong 只有 os/ 树，没有 update/（实测 6/update/ 下只有 aarch64 与 x86_64）。
    # 不覆写的话取材会在 repomd.xml 上 404 —— 那是「这一支没有维护树」这个事实，
    # 不是取材逻辑坏了，所以显式写出来而不是靠容错吞掉。
    REPO_BASES="$_KSREPO/6/os/$RPMARCH"
    ;;
esac

# 信任根。这个源没有 repomd.xml.asc，也不在树里放公钥，所以信任落在**逐包 GPG
# 签名**上（实测 rpm 头里有 PGP/DSA 签名 tag），比只验一个 repomd 更严。
# 公钥取自官方 Desktop 6 ISO 根目录的 RPM-GPG-KEY-kylinsec-release，指纹钉死：
# 不钉指纹的话任何一把 key 都能让「验签通过」成立。
# UID 写的是 Kylin OS <support@kylinos.com.cn>（麒麟软件的域名，不是信安自己的），
# 这是厂商现状，如实记录。
RPM_KEY=keys/RPM-GPG-KEY-kylinsec-release
RPM_KEY_FP=8F434C79B39C1EC7C0745C256E6E678229785861

USRMERGE=yes
RPM_DB_BACKEND=ndb                # 厂商的 rpm 4.18.2 编译时默认后端是 ndb。不设的话
                                  # 装完镜像内 rpm -qa 返回 0 行而退出码 0，与「空镜像」
                                  # 不可区分（研究 repo §4.4 踩过）

# ── 验收基线 ────────────────────────────────────────────────────────────────
# 从 rpm 里直接读出来的，不是按 gcc 版本推的：libstdc++-12.3.1-36.ks6 里
# libstdc++.so.6.0.30，最高符号版本 GLIBCXX_3.4.30。
# 三个架构的 glibc 与 gcc 版本实测完全一致（2.38-47 / 12.3.1-36），因此不按架构覆写。
EXPECT_GLIBC=2.38
EXPECT_LIBSTDCPP=6.0.30
EXPECT_GLIBCXX=3.4.30
EXPECT_CXX=yes                    # 介质与源都带 gcc-c++ 与 libstdc++-devel
EXPECT_OS_REPO=yes                # 有公开在线源，出厂写 /etc/yum.repos.d
EXPECT_SHADOW=0:0/0               # rpm 系的 shadow 属主/权限与 deb 侧不同

# ── 三个档位的种子包 ────────────────────────────────────────────────────────
# 依赖闭包由 repodata 求，这里只列种子。filesystem/setup/basesystem 必须在种子里：
# 装的时候 rpm 不保证 filesystem 排在最前，/lib64 会先被建成真实目录，
# 然后报 File from package already exists as a directory（研究 repo §4.4）。
SLICE_MICRO="filesystem,setup,basesystem,glibc,glibc-common,glibc-all-langpacks,bash,coreutils,rpm,rpm-libs,ca-certificates,tzdata,sed,grep,tar,gzip,findutils,diffutils,gawk,hostname,ncurses-base,ncurses-libs,shadow,util-linux,libgcc,libstdc++,zlib,openssl-libs,chkconfig"
SLICE_BASE_EXTRA="iproute,iputils,vim-minimal,lsof,zstd,unzip,dnf,dnf-data,python3,curl,procps-ng,less,file,xz,systemd,dbus"
SLICE_DEVEL_EXTRA="gcc,gcc-c++,make,glibc-devel,libstdc++-devel,binutils,rpm-build,cpp,pkgconf"

# SOURCE_DATE_EPOCH 不写死：由取材时各源 repomd 的 revision 取最大值得出，
# 那是真实时间戳。写个常量会变成假锚点 —— 看着有值，其实与产物无关。
