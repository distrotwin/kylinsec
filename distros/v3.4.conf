# 麒麟信安桌面版 V3.4-4A —— 上一代桌面线，提供 glibc 2.28 那一档 ABI
#
# 命名说明：DID 写 v3.4 而不是 v34。v34 容易被读成「比 v6 更新的版本」，而它实际是
# 上一代。厂商的完整版本号是 3.4-4A，tag 上只写 v3.4——不额外发别名，那会让 tag
# 数量翻倍而不增加信息；完整版本号可从 cn.internal.repo-bases 这个 label 读出来。
#
# 这一支 2024-11 起停止更新（其 os/<arch>/update 树的 revision 就停在 2024-11-19），
# 收它的理由是 ABI 阶梯：信安自己横跨 2.28 / 2.34 / 2.38 三档，而 2.34 只在
# Server 3.5.2 上有、桌面线没有。所以桌面线能给的是 2.28 与 2.38 两端。
DID=v3.4
DISPLAY_NAME="麒麟信安桌面版 V3.4-4A"
IMAGE=kylinsec-v3.4
FAMILY=rpm
METHOD=rpmrepo

# 注意层级与 V6 不同：V6 的维护树在 6/update/<arch>，这一支在
# 3.4-4A/os/<arch>/update（另有 3.4-4A/release-update/<arch>，revision 停在
# 2022-04-26，比前者旧两年半，因此不用它）。厂商的目录约定并不统一，
# 只能逐版本核过再写。
_KSREPO=http://mirrorlist.kylinsec.com.cn:8888/publicrepo
REPO_BASES="$_KSREPO/3.4-4A/os/$RPMARCH $_KSREPO/3.4-4A/os/$RPMARCH/update"

RPM_KEY=keys/RPM-GPG-KEY-kylinsec-release
RPM_KEY_FP=8F434C79B39C1EC7C0745C256E6E678229785861

USRMERGE=no                       # 3.4 这一代还没做 usr-merge
RPM_DB_BACKEND=                   # 留空：这一支的后端由目标自己定，见下一项
RPM_DB_VIA_TARGET=yes             # 目标与宿主的数据库格式**没有交集**：这一支自带
                                  # rpm 4.15.1，只支持 bdb（给它 ndb 或 sqlite 都建出 0 个
                                  # 文件）；而 builder 的 rpm 4.20 自 4.19 起去掉 bdb 写支持，
                                  # 指定 bdb 会接受参数、返回 0、什么都不建。两端谈不成，
                                  # 所以文件由宿主 rpm 落位、包登记交给目标自己的 rpm 重做。
                                  # V6 不需要这一步：它的 rpm 4.18.2 认 ndb，宿主也能写。
                                  # sqlite，而目标的 rpm 4.15.1 读不了；更麻烦的是给
                                  # 4.20 指定 bdb 它会**静默接受且一个文件都不建**，
                                  # 于是镜像内 rpm -qa 返回 0 行而退出码 0，与「空镜像」
                                  # 不可区分。ndb 自 rpm 4.14 起可用，两端都认。

# 基线从 rpm 里直接读：libstdc++-7.3.0-20210605.40.kb1.ky3 里 libstdc++.so.6.0.24，
# 最高符号版本 GLIBCXX_3.4.24。两个架构的 glibc/gcc 实测一致，不按架构覆写。
EXPECT_GLIBC=2.28
EXPECT_LIBSTDCPP=6.0.24
EXPECT_GLIBCXX=3.4.24
EXPECT_CXX=yes
EXPECT_OS_REPO=yes
EXPECT_SHADOW=0:0/0

# 种子与 V6 同构，但去掉这一代没有的包：procps-ng 在 3.4 里叫 procps，
# pkgconf-pkg-config 还没拆出来（叫 pkgconfig）。这类差异只能对着 pkglist 逐个核，
# 照抄另一个版本会在切档位时才报「依赖未解析」（研究 repo 在 UOS 上踩过同一个坑）。
SLICE_MICRO="filesystem,setup,basesystem,glibc,glibc-common,glibc-all-langpacks,bash,coreutils,rpm,rpm-libs,ca-certificates,tzdata,sed,grep,tar,gzip,findutils,diffutils,gawk,hostname,ncurses-base,ncurses-libs,shadow,util-linux,libgcc,libstdc++,zlib,openssl-libs,chkconfig"
SLICE_BASE_EXTRA="iproute,iputils,vim-minimal,lsof,zstd,unzip,dnf,python3,curl,procps-ng,less,file,xz,systemd,dbus"
SLICE_DEVEL_EXTRA="gcc,gcc-c++,make,glibc-devel,libstdc++-devel,binutils,rpm-build,cpp,pkgconf"
